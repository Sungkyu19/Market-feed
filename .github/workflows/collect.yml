name: collect

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 공시 수집 (DART, EDGAR)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector.py --config config.json --sources dart,edgar

      - name: 텔레그램 공개 미리보기 수집
        continue-on-error: true
        run: python telegram_preview.py --config config.json

      - name: 결과 저장
        run: |
          git config user.name "market-feed-bot"
          git config user.email "market-feed-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
